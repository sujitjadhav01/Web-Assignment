

<!DOCTYPE html>
<html>
<head>
    <title>Q1 Table</title>
    <style>
        table{
            border-collapse: collapse;
            width: 500px;
            text-align: center;
            margin: 20px auto;
        }

        td, th{
            border: 2px solid black;
            padding: 10px;
            font-size: 22px;
            color: red;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th colspan="4">Date</th>
    </tr>

    <tr>
        <th colspan="2">Day</th>
        <th colspan="2">Year</th>
    </tr>

    <tr>
        <td>1</td>
        <td rowspan="2">0</td>
        <td rowspan="2">20</td>
        <td>21</td>
    </tr>

    <tr>
        <td>2</td>
        <td>22</td>
    </tr>

    <tr>
        <td colspan="2">June</td>
        <td colspan="2">2000</td>
    </tr>

    <tr>
        <td colspan="2">July</td>
        <td colspan="2">2001</td>
    </tr>
</table>

</body>
</html>
